services:
  postgres:
    image: postgres:16-alpine
    container_name: app-server-postgres
    environment:
      POSTGRES_DB: appserver
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
